# The `ibex-polars` wheel: the IbexEngine for Polars (`ibex_polars`), the
# independent Python frontend it builds on (`ibex`), and their native bridge
# (`ibex_pyarrow`, with the Arrow/Parquet libraries it links).
#
#   pip wheel ./python            # or: python -m build --wheel python
#
# This builds the repository's CMake project (one level up) with only the
# minimal runtime, the Parquet backend and the bridge. The repository-root
# pyproject.toml is the separate benchmark environment, not this package.

[build-system]
requires = ["scikit-build-core>=0.11", "setuptools-scm>=8"]
build-backend = "scikit_build_core.build"

[project]
name = "ibex-polars"
dynamic = ["version"]
description = "Run Polars lazy queries on the Ibex columnar engine"
readme = "ibex_polars/README.md"
license = "AGPL-3.0-only"
authors = [{ name = "Bob Jansen" }]
requires-python = ">=3.11"
# The adapter translates Polars' internal plan visitor, which is
# version-specific: IbexEngine refuses any other Polars release.
dependencies = [
    "polars==2.0.0",
    "pyarrow>=14",
    "numpy>=1.26",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Database :: Database Engines/Servers",
]

[project.urls]
Homepage = "https://github.com/bobjansen/Ibex"
Documentation = "https://github.com/bobjansen/Ibex/blob/main/python/ibex_polars/README.md"

[tool.scikit-build]
cmake.source-dir = ".."
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"
# Only the bridge: no REPL, plugins, tests or Arrow headers.
build.targets = ["ibex_pyarrow"]
install.components = ["python"]
wheel.packages = ["ibex", "ibex_polars"]
wheel.exclude = ["**/__pycache__"]
sdist.include = ["../"]
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"

# Arrow's deep object paths under the CI checkout overrun MSVC's 260-character
# path limit; build close to the drive root there.
[[tool.scikit-build.overrides]]
if.platform-system = "^win32"
if.env.CIBUILDWHEEL = true
build-dir = "C:/ibx/{wheel_tag}"

[tool.scikit-build.cmake.define]
IBEX_MINIMAL_RUNTIME = "ON"
IBEX_BUILD_PYTHON_BRIDGE = "ON"
IBEX_BUILD_PARQUET = "ON"
IBEX_PARQUET_LOCAL_ONLY = "ON"
IBEX_PARQUET_S3 = "OFF"
IBEX_BUILD_TESTS = "OFF"
IBEX_BUILD_TOOLS = "OFF"
IBEX_BUILD_UI = "OFF"
IBEX_BUILD_EXAMPLES = "OFF"
IBEX_BUILD_LIGHTGBM = "OFF"
# Wheels run on machines other than the builder's.
IBEX_ENABLE_MARCH_NATIVE = "OFF"

[tool.setuptools_scm]
root = ".."
# Release tags are vX.Y.Z; untagged commits get a .devN local version.
local_scheme = "no-local-version"

[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_*"
build-frontend = "build"
test-command = "python {project}/python/test_wheel_smoke.py"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
archs = ["x86_64"]
# Every Python version rebuilds the same Arrow; ccache makes versions 2..N cheap.
before-all = "dnf install -y epel-release && dnf install -y ccache || true"
environment = { CCACHE_BASEDIR = "/project", CCACHE_DIR = "/project/.ccache-wheel", CMAKE_BUILD_PARALLEL_LEVEL = "4" }

[tool.cibuildwheel.macos]
archs = ["arm64"]
environment = { MACOSX_DEPLOYMENT_TARGET = "15.0", CMAKE_BUILD_PARALLEL_LEVEL = "4" }

[tool.cibuildwheel.windows]
archs = ["AMD64"]
environment = { CMAKE_BUILD_PARALLEL_LEVEL = "4" }
